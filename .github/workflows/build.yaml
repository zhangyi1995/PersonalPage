name: Build

# 发布质量门禁：只构建，不部署。线上发布由 Cloudflare 的 Git 集成完成。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
  STRICT: '1'

jobs:
  build:
    name: Strict build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download OINK
        run: go mod download github.com/pgsty/oink

      # 与 Cloudflare 走同一个脚本，Hugo 版本只在 bin/build.sh 里定义一次。
      # STRICT=1 让任何警告都视为失败：宁可在 CI 里拦下，也不发半成品页面。
      - name: Build
        run: bash bin/build.sh

      # 产物断言：中英首页、Agent 输出与站点基础文件缺一不可。
      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/en/index.html
          test -f public/llms.txt
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/blog/why-oink/index.md
          test -f public/en/blog/why-oink/index.md
          echo "所有产物断言通过"
